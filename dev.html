<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEV</title>

<link rel="stylesheet" href="https://use.typekit.net/qsa5fag.css">

<style>

body {

margin: 40px 24px;

background-color: #fff;

background-image: url('/archive-bg.jpg');

background-size: cover;

background-position: center;

background-attachment: fixed;

font-family: "jimbo-std-expanded", sans-serif;

}

h1 {

font-size: 40px;
margin-bottom: 50px;

}

.post-list {

display: flex;
flex-direction: column;
gap: 26px;

}

.post-list {

display: grid;

grid-template-columns: repeat(auto-fit, 180px);

justify-content: center;

gap: 26px 60px;

width: fit-content;

margin: 60px auto 0;  

}  

.post-list {

display: grid;

grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

gap: 26px 60px;

padding: 0 120px;

}

</style>

</head>

<body>

<h1>DEV</h1>

<div class="post-list">

{% for post in site.posts %}

<a href="{{ post.url | relative_url }}">
{{ post.title }}
</a>

{% endfor %}

</div>

</body>

</html>
