<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>archive</title>

<link rel="stylesheet" href="https://use.typekit.net/qsa5fag.css">

<style>

body {

  margin: 0;

  padding: 40px 24px;

  background-color: #fff;

  background-image: url('/archive-bg.jpg');

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  font-family: "jimbo-std-expanded", sans-serif;

  min-height: 100vh;

  display: flex;
  flex-direction: column;

}

h1 {

font-size: 40px;
margin-bottom: 50px;

}

.post-list {

display: grid;

grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

gap: 26px 60px;

padding-left: 80px;

padding-right: 80px;  

text-align: center;  

}

.post-list a {

font-size: 24px;

text-decoration: none;

color: #111;

line-height: 1.5;

}

.post-list a:hover {

opacity: 0.5;

}

.back-link {

  display: inline-block;

  margin-top: -40px;
  margin-bottom: 50px;

  text-decoration: none;

  color: #111;

  font-size: 14px;

  .back-link:hover {

  color: #888;

}  

</style>

</head>

<body>

<h1>archive</h1>

<a href="{{ site.baseurl }}/" class="back-link">
  &lt; back
</a>

<div class="post-list">

{% for post in site.posts %}

<a href="{{ post.url | relative_url }}">
{{ post.title }}
</a>

{% endfor %}

</div>

</body>  

</html>
